<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Duelo de Insultos — Homenaje a Monkey Island</title>
<style>
  :root{
    --ink:#e8e8f0;
    --opt:#b8a8e8;
    --opt-hot:#ffee66;
    --panel:#000000;
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    background:#000;
    color:var(--ink);
    font-family:"Courier New", ui-monospace, monospace;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:manipulation;
  }
  #game{
    width:min(100vw, 112dvh);
    height:100dvh;
    display:flex;
    flex-direction:column;
  }
  #scene{
    position:relative;
    width:100%;
    aspect-ratio:16/10;
    background:#000;
    flex-shrink:0;
  }
  #cv{
    width:100%;
    height:100%;
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
  }
  /* CRT scanlines */
  #scene::after{
    content:"";
    position:absolute; inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
      rgba(0,0,0,.16) 3px, rgba(0,0,0,0) 4px);
  }
  #overlay{
    position:absolute; inset:0;
    pointer-events:none;
    overflow:hidden;
  }
  .speech{
    position:absolute;
    transform:translate(-50%,-100%);
    max-width:48%;
    text-align:center;
    font-size:clamp(10px, 1.6vw, 17px);
    line-height:1.35;
    text-shadow:
      2px 0 0 #000, -2px 0 0 #000, 0 2px 0 #000, 0 -2px 0 #000,
      2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    white-space:pre-line;
  }
  .toast{
    position:absolute;
    left:50%; top:6%;
    transform:translateX(-50%);
    color:#8fe08f;
    font-size:clamp(9px, 1.4vw, 15px);
    max-width:90%;
    text-shadow:2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
    text-align:center;
  }
  #panel{
    background:var(--panel);
    border-top:4px solid #2a1a4a;
    flex:1;
    min-height:0;
    padding:.5em .9em calc(.7em + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
  }
  #status{
    color:#6a5a9a;
    font-size:clamp(9px, 1.3vw, 14px);
    display:flex;
    justify-content:space-between;
    padding-bottom:.35em;
    letter-spacing:1px;
  }
  #choices{
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    flex:1;
  }
  #choices::-webkit-scrollbar{ width:10px; }
  #choices::-webkit-scrollbar-thumb{ background:#3a2a6a; }
  .opt{
    color:var(--opt);
    font-size:clamp(11px, 1.6vw, 17px);
    line-height:1.45;
    padding:.28em .2em;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
  }
  .opt:hover, .opt:active{ color:var(--opt-hot); }
  .opt::before{ content:"► "; color:#5a4a8a; }
  .opt:hover::before, .opt:active::before{ color:var(--opt-hot); }
  .hint{
    color:#5a4a8a;
    font-size:clamp(9px, 1.3vw, 13px);
    padding:.2em;
  }
  /* ------- móvil vertical ------- */
  @media (orientation:portrait){
    #game{ width:100vw; justify-content:center; }
    #panel{ flex:0 0 auto; min-height:34dvh; max-height:46dvh; }
    .speech{ font-size:clamp(10px, 3.2vw, 16px); max-width:60%; }
    .toast{ font-size:clamp(10px, 3vw, 15px); }
    #status{ font-size:clamp(10px, 3vw, 14px); }
    .opt{ font-size:clamp(13px, 4.2vw, 19px); padding:.45em .2em; }
    .hint{ font-size:clamp(10px, 3vw, 13px); }
  }
  /* Title screen */
  #title{
    position:absolute; inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    z-index:10;
    gap:2vh;
    padding:0 4vw;
  }
  #title h1{
    font-size:clamp(20px, 7vw, 64px);
    color:#ffd23e;
    letter-spacing:2px;
    text-shadow:
      3px 3px 0 #c0392b, 6px 6px 0 #6a1a10,
      -2px -2px 0 #7a4a00;
    line-height:1.1;
  }
  #title h2{
    font-size:clamp(11px, 2.8vw, 26px);
    color:#b8a8e8;
    text-shadow:2px 2px 0 #2a1a4a;
    letter-spacing:3px;
  }
  #title .press{
    margin-top:3vh;
    color:#e8e8f0;
    font-size:clamp(12px, 3vw, 20px);
    animation:blink 1.1s steps(2) infinite;
  }
  #title .foot{
    position:absolute;
    bottom:calc(2.5vh + env(safe-area-inset-bottom));
    color:#555;
    font-size:clamp(8px, 2vw, 13px);
  }
  @keyframes blink{ 50%{ opacity:0; } }
</style>
</head>

/* ============================================================
   RENDER — escena 320x200 (resolución original de MI1)
   ============================================================ */
const cv = document.getElementById("cv");
const g = cv.getContext("2d");
g.imageSmoothingEnabled = false;

const GROUND = 190;
const HORIZON = 118, SEA_BOT = 152;

/* --- fondo estático pre-renderizado --------------------------- */
const bg = document.createElement("canvas");
bg.width = 320; bg.height = 200;
const bgc = bg.getContext("2d");

function bR(x,y,w,h,c){ bgc.fillStyle=c; bgc.fillRect(x,y,w,h); }
function dither(y0, rows, cA, cB){
  for (let y=y0; y<y0+rows; y++)
    for (let x=0; x<320; x++)
      bR(x,y,1,1, ((x+y)&1) ? cB : cA);
}

function renderBackground(){
  // cielo: degradado con tramado (marca de la casa VGA)
  const SKY = ["#06061c","#0b0b2c","#12103c","#1a144c","#241a58","#2e2264"];
  const bandH = Math.floor(HORIZON / SKY.length);
  for (let i=0;i<SKY.length;i++){
    bR(0, i*bandH, 320, bandH+2, SKY[i]);
    if (i>0) dither(i*bandH-1, 3, SKY[i-1], SKY[i]);
  }
  // nubes finas
  bgc.fillStyle="#1a1440";
  bR(120,44,52,2); bR(136,42,30,2); bR(105,47,26,1);
  bR(196,62,44,2); bR(210,60,22,1);
  // luna con cráteres y halo
  const mx=252, my=36, r=17;
  for (let dy=-r-4;dy<=r+4;dy++) for (let dx=-r-4;dx<=r+4;dx++){
    const d2 = dx*dx+dy*dy;
    if (d2<=r*r){
      bR(mx+dx,my+dy,1,1, d2>r*r-22 ? "#d6d09a" : "#f0ecc0");
    } else if (d2 <= (r+3)*(r+3) && ((dx+dy)&1)){
      bR(mx+dx,my+dy,1,1,"#2a2a56");
    }
  }
  bgc.fillStyle="#cfc890";
  bR(mx-6,my-4,4,3); bR(mx+3,my+5,5,3); bR(mx-2,my+1,3,2);
  bR(mx+6,my-7,3,2); bR(mx-9,my+6,3,2);
  // silueta de isla con luces de pueblo (Mêlée Town)
  bgc.fillStyle="#0c0c22";
  bR(8,112,86,6); bR(18,108,30,4); bR(52,106,22,6); bR(60,102,8,4);
  bgc.fillStyle="#ffd23e";
  bR(30,112,1,1); bR(44,110,1,1); bR(58,109,1,1); bR(64,105,1,1); bR(72,111,1,1);
  // barquito en el horizonte
  bgc.fillStyle="#0c0c22";
  bR(150,112,16,3); bR(153,104,1,8); bR(159,106,1,6);
  bR(154,105,4,3); bR(160,107,3,2);
  // mar
  bR(0,HORIZON,320,4,"#0e2c50");
  bR(0,HORIZON+4,320,14,"#123458");
  dither(HORIZON+16,2,"#123458","#16406e");
  bR(0,HORIZON+18,320,SEA_BOT-HORIZON-18,"#16406e");
  // muelle de tablones
  bR(0,SEA_BOT,320,200-SEA_BOT,"#553820");
  bR(0,SEA_BOT,320,2,"#7a5230");
  bR(0,SEA_BOT+2,320,1,"#38220f");
  for (let y=SEA_BOT+2, i=0; y<200; y+=8, i++){
    bR(0,y,320,7, i%2 ? "#5d3d24" : "#553820");
    bR(0,y+7,320,1,"#38220f");
  }
  for (let x=6; x<320; x+=44){
    bR(x,SEA_BOT+3,2,197-SEA_BOT,"#45301a");
    for (let y=SEA_BOT+6; y<198; y+=8) bR(x,y,1,1,"#241608");
  }
  // norays (postes de amarre) + cuerda combada
  bollard(16,124); bollard(298,122);
  bgc.fillStyle="#6a4c2c";
  for (let x=22; x<298; x+=2){
    const t=(x-22)/276;
    const y = 126 + Math.round(Math.sin(Math.PI*t)*7) - Math.round(2*Math.abs(t-.5)*2);
    bR(x,y,2,1,"#5a3e22");
  }
  // barril a la derecha
  barrel(297,166);
  // caja a la izquierda
  crate(2,168);
  // palmera en silueta
  palmTree();
}

function bollard(x,top){
  bR(x,top,7,SEA_BOT-top+6,"#3a2412");
  bR(x,top,7,3,"#4c3018");
  bR(x+1,top+3,1,SEA_BOT-top,"#241608");
}

function barrel(x,y){
  bR(x,y,22,30,"#6a4a2a");
  for (let i=0;i<22;i+=4) bR(x+i,y,2,30,"#583c20");
  bR(x,y+4,22,3,"#2a1c10");
  bR(x,y+22,22,3,"#2a1c10");
  bR(x,y,22,2,"#7a5a36");
}

function crate(x,y){
  bR(x,y,26,28,"#5a3c22");
  bR(x,y,26,3,"#45301a"); bR(x,y+25,26,3,"#45301a");
  bR(x,y,3,28,"#45301a"); bR(x+23,y,3,28,"#45301a");
  bR(x+4,y+6,18,1,"#38220f"); bR(x+4,y+14,18,1,"#38220f"); bR(x+4,y+20,18,1,"#38220f");
  bR(x+3,y+3,20,1,"#6a4a2c");
}

function palmTree(){
  bgc.fillStyle="#12101f";
  // tronco curvado con segmentos
  for (let i=0;i<16;i++){
    const tx = 46 - Math.round(Math.pow(i/15,1.6)*16);
    const ty = 152 - i*6;
    bR(tx,ty,4,7,"#12101f");
    if (i%3===0) bR(tx,ty,4,1,"#0a0916");
  }
  const cx=30, cy=58;
  // frondas
  const F=[[1,-0.4],[1,0.35],[0.5,-1],[-0.5,-1],[-1,-0.3],[-1,0.4]];
  for (const [fx,fy] of F){
    for (let i=0;i<9;i++){
      const w = i<5 ? 4 : 3;
      bR(Math.round(cx+fx*i*3.2), Math.round(cy+fy*i*2.4+(fy>0? i*.8: i*.3)), w, 2, "#12101f");
    }
  }
  bR(cx-2,cy+1,4,4,"#0a0916"); bR(cx+3,cy+2,4,4,"#0a0916"); // cocos
}
renderBackground();

/* --- estrellas dinámicas -------------------------------------- */
const STARS = [];
(function(){ let s = 98765;
  const rnd = () => (s = (s*1103515245+12345) & 0x7fffffff) / 0x7fffffff;
  while (STARS.length<60){
    const x = Math.floor(rnd()*320), y = Math.floor(rnd()*100), ph = rnd();
    const dx=x-252, dy=y-36;
    if (dx*dx+dy*dy < 24*24) continue;      // fuera de la luna
    STARS.push([x,y,ph]);
  }
})();

/* --- pintado de sprites ---------------------------------------- */
function paintMap(rows, ox, oy, pal, lean, stripe){
  for (let r=0; r<rows.length; r++){
    const row = rows[r];
    const dy = oy + r;                       // negativo = por encima del suelo
    const hf = Math.max(0, -dy) / BODYH;     // 0 pies, 1 cabeza
    const off = Math.round((lean||0) * hf);
    for (let cix=0; cix<row.length; cix++){
      const ch = row[cix];
      if (ch === ".") continue;
      let col = FIXED[ch] || pal[PCOLOR[ch]];
      if (stripe && (ch==="C"||ch==="c") && (((dy%4)+4)%4) < 2)
        col = ch==="C" ? pal.stripe : pal.stripeD;
      if (!col) continue;
      g.fillStyle = col;
      g.fillRect(ox + cix + off, dy, 1, 1);
    }
  }
}

function drawActor(x, pal, pose, flip, t){
  g.save();
  g.translate(Math.round(x), GROUND);
  if (flip) g.scale(-1,1);
  // sombra
  g.fillStyle = "rgba(0,0,0,0.35)";
  g.fillRect(-9,0,20,2); g.fillRect(-7,2,16,1);
  const bob = pose==="idle" ? Math.round(Math.sin(t/380)) : 0;
  let dx=0, lean=0;
  if (pose==="attack"){ dx=10; lean=3; }
  if (pose==="hit"){ dx=-6; lean=-8; }
  g.translate(dx, bob);
  const top = -BODYH;
  const stripe = !!pal.stripe;
  paintMap(BODY, -7, top, pal, lean, stripe);
  const hg = HEADGEAR[pal.headgear];
  if (hg) paintMap(hg.rows, -7, top+hg.oy, pal, lean, false);
  const arm = ARMS[pose] || ARMS.idle;
  paintMap(arm.rows, -7, top+arm.oy, pal, lean, stripe);
  g.restore();
}

/* --- efectos animados ------------------------------------------ */
function drawWater(t){
  // reflejo de la luna
  const step = Math.floor(t/260);
  for (let i=0;i<8;i++){
    const y = HORIZON+3+i*4;
    const w = 12 - i;
    const jitter = ((step+i*3)%5)-2;
    g.fillStyle = i<3 ? "#6a8ab8" : "#41638f";
    g.fillRect(246 + jitter + i, y, Math.max(3,w), 1);
  }
  // destellos de olas
  g.fillStyle="#2a5686";
  for (let i=0;i<12;i++){
    const wx = ((i*47 + Math.floor(t/180)) % 350) - 15;
    g.fillRect(wx, HORIZON+6+(i%5)*6, 10, 1);
  }
}

function drawLantern(t){
  const x=10, y=132;                 // colgado del noray izquierdo
  const flick = Math.sin(t/90)+Math.sin(t/37);
  // brazo y gancho
  g.fillStyle="#241608"; g.fillRect(x+6,y-6,8,2); g.fillRect(x+12,y-5,2,3);
  // halo cálido tramado
  g.fillStyle = flick>0 ? "rgba(255,190,60,0.10)" : "rgba(255,190,60,0.07)";
  g.fillRect(x+6,y-6,14,18);
  g.fillRect(x+3,y-2,20,10);
  // farol
  g.fillStyle="#2a1c10"; g.fillRect(x+9,y-2,8,10);
  g.fillStyle = flick>0.5 ? "#ffe28a" : "#ffd23e";
  g.fillRect(x+11,y,4,6);
  g.fillStyle="#2a1c10"; g.fillRect(x+9,y-3,8,2); g.fillRect(x+10,y+8,6,2);
}

function drawSpark(t){
  if (!world.spark) return;
  const age = t - world.spark.t;
  if (age > 260){ world.spark = null; return; }
  const {x,y} = world.spark;
  const r = 2 + age/45;
  g.fillStyle = age<130 ? "#ffffff" : "#ffd23e";
  const pts = [[r,0],[-r,0],[0,r],[0,-r],[r*0.7,r*0.7],[-r*0.7,-r*0.7],[r*0.7,-r*0.7],[-r*0.7,r*0.7]];
  for (const [dx,dy] of pts) g.fillRect(Math.round(x+dx), Math.round(y+dy), 2, 2);
}

function frame(t){
  g.drawImage(bg,0,0);
  // estrellas con parpadeo
  for (const [sx,sy,ph] of STARS){
    const tw = Math.sin(t/700 + ph*20) > -0.6;
    g.fillStyle = tw ? "#cfd6ff" : "#5a5a8a";
    g.fillRect(sx,sy,1,1);
  }
  drawWater(t);
  drawLantern(t);
  // ventaja: el que gana empuja al otro
  const shift = (world.pScore - world.eScore) * 11;
  drawActor(world.enemy.x + shift, world.enemy.pal, world.enemy.pose, true, t+400);
  drawActor(world.player.x + shift, world.player.pal, world.player.pose, false, t);
  drawSpark(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============================================================
   SONIDO — WebAudio, chip retro
   ============================================================ */
let AC = null;
function audio(){ if (!AC) try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} return AC; }
function beep(freq, dur, type, vol, when){
  const ac = audio(); if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), ga = ac.createGain();
  o.type = type||"square"; o.frequency.value = freq;
  ga.gain.setValueAtTime(vol||0.08, ac.currentTime+(when||0));
  ga.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+(when||0)+dur);
  o.connect(ga); ga.connect(ac.destination);
  o.start(ac.currentTime+(when||0)); o.stop(ac.currentTime+(when||0)+dur+0.02);
}
const sfx = {
  talk(){ beep(220+Math.random()*80, .05, "square", .03); },
  clang(){ beep(2400,.09,"square",.05); beep(3100,.14,"sawtooth",.04,.02); beep(1700,.2,"triangle",.05,.04); },
  hit(){ beep(140,.18,"sawtooth",.09); beep(90,.25,"square",.08,.05); },
  win(){ [523,659,784,1047].forEach((f,i)=>beep(f,.16,"square",.06,i*.13)); },
  lose(){ [392,330,262,196].forEach((f,i)=>beep(f,.2,"square",.06,i*.16)); },
  learn(){ beep(880,.09,"square",.05); beep(1318,.15,"square",.05,.09); },
};

/* ============================================================
   UI — bocadillos SCUMM y panel de diálogo
   ============================================================ */
const overlay = document.getElementById("overlay");
const choicesEl = document.getElementById("choices");
const stLeft = document.getElementById("st-left");
const stRight = document.getElementById("st-right");

const sleep = ms => new Promise(r=>setTimeout(r,ms));

function charScreenX(who){
  const shift = (world.pScore - world.eScore) * 11;
  return (who==="player" ? world.player.x : world.enemy.x) + shift;
}

function say(who, text, holdMs){
  const div = document.createElement("div");
  div.className = "speech";
  div.textContent = text;
  div.style.color = who==="player" ? "#ffffff" : "#ff8fe8";
  const pct = Math.max(25, Math.min(75, charScreenX(who)/320*100));
  div.style.left = pct + "%";
  div.style.top  = ((GROUND-52)/200*100) + "%";
  overlay.appendChild(div);
  sfx.talk();
  const ms = holdMs || Math.max(1900, 55*text.length + 900);
  return sleep(ms).then(()=>div.remove());
}

function toast(text, ms){
  const div = document.createElement("div");
  div.className = "toast";
  div.textContent = text;
  overlay.appendChild(div);
  return sleep(ms||2200).then(()=>div.remove());
}

function setStatus(enemyName){
  stLeft.textContent  = PLAYER_NAME.toUpperCase()+" "+"●".repeat(world.pScore)+"○".repeat(WIN_SCORE-world.pScore);
  stRight.textContent = "●".repeat(world.eScore)+"○".repeat(WIN_SCORE-world.eScore)+" "+enemyName.toUpperCase();
}

function clearChoices(){ choicesEl.innerHTML=""; }

function hint(text){
  clearChoices();
  const d = document.createElement("div");
  d.className = "hint";
  d.textContent = text;
  choicesEl.appendChild(d);
}

let kbHandler = null;
function choose(options){
  return new Promise(resolve=>{
    clearChoices();
    options.forEach((op,idx)=>{
      const d = document.createElement("div");
      d.className = "opt";
      d.textContent = op.text;
      d.onclick = ()=>{ cleanup(); resolve(op); };
      choicesEl.appendChild(d);
    });
    kbHandler = ev=>{
      const n = parseInt(ev.key,10);
      if (n>=1 && n<=options.length){ cleanup(); resolve(options[n-1]); }
    };
    window.addEventListener("keydown", kbHandler);
    function cleanup(){
      window.removeEventListener("keydown", kbHandler);
      kbHandler = null;
      clearChoices();
    }
  });
}

const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ============================================================
   ANIMACIONES DE COMBATE
   ============================================================ */
function pose(who, p){ world[who].pose = p; }

async function clash(attacker){
  // ataque bloqueado: chispa entre ambos
  pose(attacker,"attack");
  await sleep(240);
  const shift = (world.pScore - world.eScore) * 11;
  world.spark = { x:160+shift, y:GROUND-26, t:performance.now() };
  sfx.clang();
  const defender = attacker==="player" ? "enemy" : "player";
  pose(defender,"attack");
  await sleep(380);
  pose(attacker,"idle"); pose(defender,"idle");
}

async function strike(attacker){
  // golpe conectado: el defensor encaja
  const defender = attacker==="player" ? "enemy" : "player";
  pose(attacker,"attack");
  await sleep(240);
  const shift = (world.pScore - world.eScore) * 11;
  world.spark = { x:(defender==="player"? world.player.x+12 : world.enemy.x-12)+shift, y:GROUND-26, t:performance.now() };
  sfx.hit();
  pose(defender,"hit");
  await sleep(620);
  pose(attacker,"idle"); pose(defender,"idle");
}

/* ============================================================
   LÓGICA DEL DUELO
   ============================================================ */
function defenseOptions(correctIdx){
  const opts = [];
  for (const k of known.comebacks) opts.push({ text:INSULTS[k].c, ok:k===correctIdx });
  for (const d of shuffle(DECOYS).slice(0,2)) opts.push({ text:d, ok:false });
  return shuffle(opts);
}

function attackOptions(){
  return shuffle([...known.insults]).map(k=>({ text:INSULTS[k].i, idx:k }));
}

function enemyPicksInsult(){
  const unknown = INSULTS.map((_,i)=>i).filter(i=>!known.comebacks.has(i));
  if (unknown.length && Math.random()<0.6) return pick(unknown);
  return Math.floor(Math.random()*INSULTS.length);
}

async function learn(idx){
  if (known.comebacks.has(idx)) return;
  known.comebacks.add(idx);
  known.insults.add(idx);
  sfx.learn();
  await toast("Has aprendido un insulto nuevo (y su respuesta) para el próximo asalto.", 2600);
}

async function duel(gid, enemy){
  world.pScore = 0; world.eScore = 0;
  world.enemy.pal = enemy.pal;
  pose("player","idle"); pose("enemy","idle");
  setStatus(enemy.name);

  hint("...");
  await say("enemy", enemy.intro);                        if (gid!==gameGen) return null;
  await say("player","Me llamo "+PLAYER_NAME+" Threepwood, ¡y quiero ser un pirata!"); if (gid!==gameGen) return null;

  let attacker = "enemy";

  while (world.pScore < WIN_SCORE && world.eScore < WIN_SCORE){
    if (gid!==gameGen) return null;

    if (attacker==="enemy"){
      const idx = enemyPicksInsult();
      hint("...");
      await say("enemy", INSULTS[idx].i);                 if (gid!==gameGen) return null;
      const opt = await choose(defenseOptions(idx));      if (gid!==gameGen) return null;
      hint("...");
      await say("player", opt.text);                      if (gid!==gameGen) return null;
      if (opt.ok){
        await clash("enemy");
        world.pScore++; setStatus(enemy.name);
        await say("enemy", pick(["¡Grr!","¡Maldición!","Suerte de principiante..."]), 1300);
        attacker = "player";
      } else {
        await strike("enemy");
        world.eScore++; setStatus(enemy.name);
        await say("enemy", pick(["¡Ja!","¡Toma ya!","¿Eso es todo?"]), 1300);
        await learn(idx);                                  if (gid!==gameGen) return null;
      }
    } else {
      const opt = await choose(attackOptions());          if (gid!==gameGen) return null;
      hint("...");
      await say("player", INSULTS[opt.idx].i);            if (gid!==gameGen) return null;
      if (Math.random() < enemy.skill){
        await say("enemy", INSULTS[opt.idx].c);           if (gid!==gameGen) return null;
        await clash("player");
        await say("player", pick(["Eh... esa era buena.","¡Ha tenido suerte!"]), 1400);
        attacker = "enemy";
      } else {
        await say("enemy", pick(["Eh... ¿tu cara?","...","¡Espera, me la sé!"]), 1500);
        if (gid!==gameGen) return null;
        await strike("player");
        world.pScore++; setStatus(enemy.name);
      }
    }
  }

  const playerWon = world.pScore >= WIN_SCORE;
  hint("...");
  if (playerWon){
    pose("player","win"); pose("enemy","hit");
    sfx.win();
    await say("enemy", enemy.lose);                       if (gid!==gameGen) return null;
  } else {
    pose("enemy","win"); pose("player","hit");
    sfx.lose();
    await say("enemy", enemy.win);                        if (gid!==gameGen) return null;
  }
  pose("player","idle"); pose("enemy","idle");
  return playerWon;
}

/* ============================================================
   BUCLE PRINCIPAL
   ============================================================ */
async function main(gid){
  world.enemyIdx = 0;
  while (true){
    if (gid!==gameGen) return;
    const enemy = ENEMIES[world.enemyIdx];

    if (world.enemyIdx>0){
      await toast("Un nuevo contrincante se acerca: "+enemy.name, 2400);
      if (gid!==gameGen) return;
    }

    const won = await duel(gid, enemy);
    if (won===null) return;

    if (won){
      world.enemyIdx++;
      if (world.enemyIdx >= ENEMIES.length){
        await say("player","¡Soy el mejor espadachín de todo Mêlée Island™!", 2600);
        if (gid!==gameGen) return;
        const op = await choose([
          { text:"Jugar otra vez (conservas los insultos aprendidos)", again:true },
          { text:"Contemplar la puesta de luna con aire triunfal", again:false },
        ]);
        if (gid!==gameGen) return;
        if (!op.again){
          hint("FIN — Recarga la página para volver a jugar. Nunca pagues más de 20 dólares por un videojuego.");
          return;
        }
        world.enemyIdx = 0;
      }
    } else {
      await say("player","Vaya. Creo que necesito practicar más mis insultos.", 2200);
      if (gid!==gameGen) return;
      const op = await choose([
        { text:"Exigir la revancha ("+enemy.name+")", retry:true },
        { text:"Huir corriendo como un cobarde (empezar de cero)", retry:false },
      ]);
      if (gid!==gameGen) return;
      if (!op.retry) world.enemyIdx = 0;
    }
  }
}

/* ============================================================
   ARRANQUE
   ============================================================ */
const titleEl = document.getElementById("title");
function start(){
  if (world.started) return;
  world.started = true;
  audio();
  sfx.win();
  titleEl.style.display = "none";
  gameGen++;
  main(gameGen);
}
titleEl.addEventListener("click", start);
window.addEventListener("keydown", ev=>{ if(!world.started && (ev.key===" "||ev.key==="Enter")) start(); });
hint("");
</script>
